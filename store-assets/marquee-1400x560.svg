<svg width="1400" height="560" viewBox="0 0 1400 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="logobg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe6fb"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1400" height="560" fill="url(#bg)"/>

  <!-- faint capture frames in different aspect ratios, right side -->
  <g fill="none" stroke="#ffffff" stroke-width="3" opacity="0.14">
    <rect x="1030" y="-70" width="300" height="190" rx="14"/>
    <rect x="1305" y="110" width="170" height="230" rx="14"/>
    <rect x="1110" y="455" width="250" height="160" rx="14"/>
  </g>

  <!-- soft shadow under logo tile -->
  <rect x="110" y="170" width="250" height="250" rx="58" fill="#0b246e" opacity="0.35" filter="url(#soft)"/>

  <!-- logo tile -->
  <g id="logo" transform="translate(110,155) scale(2.5)">
    <rect x="0" y="0" width="100" height="100" rx="23" fill="url(#logobg)"/>
    <g fill="none" stroke="#2563eb" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M16 32 V16 H32"/><path d="M68 16 H84 V32"/><path d="M84 68 V84 H68"/><path d="M32 84 H16 V68"/>
    </g>
    <rect x="27" y="31" width="46" height="38" rx="5" fill="#2563eb"/>
    <rect x="31" y="40" width="26" height="25" rx="2" fill="#ffffff"/>
    <rect x="60" y="40" width="9" height="25" rx="2" fill="#ffffff" opacity="0.75"/>
  </g>

  <!-- text (and chips) -->
  <g id="txt" transform="translate(0,-23.6)">
  <text x="440" y="232" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="74" font-weight="700" fill="#ffffff">PostReady Screenshots</text>
  <text x="443" y="300" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="40" font-weight="600" fill="#ffffff">Exact sizes. No cropping.</text>
  <text x="444" y="350" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="27" font-weight="400" fill="#e6eeff">The window adapts – side panel and browser UI included.</text>

  <!-- size chips -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#ffffff">
    <rect x="444" y="388" width="238" height="42" rx="21" fill="#ffffff" fill-opacity="0.16"/>
    <text x="563" y="416" text-anchor="middle">LinkedIn 1080 × 1350</text>
    <rect x="696" y="388" width="326" height="42" rx="21" fill="#ffffff" fill-opacity="0.16"/>
    <text x="859" y="416" text-anchor="middle">Chrome Web Store 1280 × 800</text>
    <rect x="1036" y="388" width="222" height="42" rx="21" fill="#ffffff" fill-opacity="0.16"/>
    <text x="1147" y="416" text-anchor="middle">Medium 1400 × 787</text>
  </g>
  </g>
</svg>
