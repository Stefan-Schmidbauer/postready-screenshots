<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title data-i18n="studioTitle">PostReady Studio</title>
    <link rel="stylesheet" href="../ui/base.css" />
    <link rel="stylesheet" href="studio.css" />
  </head>
  <body>
    <header class="head">
      <img src="../icons/icon32.png" alt="" width="22" height="22" />
      <h1 data-i18n="studioTitle">PostReady Studio</h1>
      <span id="status" class="pill off"></span>
      <button id="openFolder" class="icon-btn" data-i18n-title="openFolder" data-i18n-aria-label="openFolder"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H9l2 2.5h8.5A1.5 1.5 0 0 1 21 9v9.5a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z"/></svg></button>
      <button id="openOptions" class="icon-btn" data-i18n-title="settings" data-i18n-aria-label="settings">⚙</button>
    </header>

    <main>
      <section class="card">
        <label class="field">
          <span data-i18n="targetWindow"></span>
          <div class="row">
            <select id="window"></select>
            <button id="connect" class="btn"></button>
          </div>
        </label>
        <div class="grid2">
          <label class="field">
            <span data-i18n="category"></span>
            <select id="category"></select>
          </label>
          <label class="field">
            <span data-i18n="size"></span>
            <select id="format"></select>
          </label>
          <label class="field">
            <span data-i18n="area"></span>
            <select id="mode"></select>
          </label>
          <label class="field">
            <span data-i18n="fileType"></span>
            <select id="fileType"></select>
          </label>
          <label class="field">
            <span data-i18n="heightMode"></span>
            <select id="heightMode"></select>
          </label>
        </div>
        <label class="field">
          <span data-i18n="fileName"></span>
          <input id="baseName" type="text" placeholder="screenshot" spellcheck="false" autocomplete="off" />
        </label>
        <p id="filenamePreview" class="hint mono"></p>
        <p class="hint">
          <span id="profileHint"></span>
          <button id="editFormats" class="link" data-i18n="editFormats"></button>
        </p>
        <div class="actions">
          <button id="fit" class="btn" data-i18n="fitWindow"></button>
          <button id="shoot" class="btn primary" data-i18n="screenshot"></button>
        </div>
        <p id="shortcuts" class="hint"></p>
      </section>

      <section id="result" class="card result" hidden>
        <h2 data-i18n="lastScreenshot"></h2>
        <img id="preview" data-i18n-alt="previewAlt" />
        <p id="resultMeta" class="meta"></p>
        <ul id="resultNotes" class="notes"></ul>
      </section>

      <section class="card">
        <h2 data-i18n="log"></h2>
        <ol id="log" class="log" data-i18n-data-empty="logEmpty"></ol>
      </section>

      <p class="hint footnote" data-i18n="studioFootnote"></p>
    </main>

    <script type="module" src="studio.js"></script>
  </body>
</html>
